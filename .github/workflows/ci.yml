name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-banner --redact --exit-code=1

  user-service:
    name: user-service build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-service
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: garant_user
          POSTGRES_PASSWORD: garant_pass
          POSTGRES_DB: garant_db_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/user-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Package lint includes --fix; CI must inspect without mutating checkout.
      - name: Lint (blocking, no autofix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
      - name: Build
        run: npm run build
        env:
          NODE_ENV: test
      - name: Unit tests
        run: npm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: garant_user
          DB_PASSWORD: garant_pass
          DB_NAME: garant_db_test
          DB_USE_SQLITE: false
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-for-ci-only
          TELEGRAM_BOT_TOKEN: 0:test_token_ci
          AUTH_DEV_MODE: true
      - name: Replay and corrupt immutable TON mainnet and testnet proof corpora
        run: npm run fixture:ton:gate

  mini-app:
    name: mini-app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mini-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (blocking)
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001/api

  contracts:
    name: contracts security, coverage & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (blocking)
        run: npm run lint -- --max-warnings=0
      - name: Compile and test
        run: npm run compile && npm test
      # Opt in after repeated deterministic green runs; other gates stay blocking.
      - name: Contract coverage gate (stable suites only)
        if: ${{ vars.CONTRACT_COVERAGE_GATE == 'true' }}
        run: npm run coverage:check
      - name: Install Slither
        run: pipx install slither-analyzer==0.10.4
      - name: Slither static analysis
        run: slither . --fail-high

  contracts-ton-compatibility:
    name: TON contract compatibility build & sandbox tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-ton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts-ton/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Audit complete compiler and test dependency tree
        run: npm audit --audit-level=moderate
      - name: Typecheck wrappers and build tooling
        run: npm run typecheck
      - name: Compile deterministic artifact
        run: npm run build
      - name: TON Sandbox tests
        run: npm test
      - name: Upload development artifacts for reproducibility comparison
        uses: actions/upload-artifact@v4
        with:
          name: ton-escrow-development-artifacts
          path: |
            contracts-ton/build/TonNativeEscrow.compiled.json
            contracts-ton/build/TonJettonEscrow.compiled.json
          if-no-files-found: error

  contracts-ton-acton:
    name: TON authoritative Acton build & assurance gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-ton
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pinned Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0
        with:
          version: "1.1.0"
          working-directory: ${{ github.workspace }}/contracts-ton
      - name: Verify pinned toolchain
        run: acton --version
      - name: Build with authoritative compiler
        run: acton build
      - name: Generate Acton test wrappers from contract ABIs
        run: |
          acton wrapper TonNativeEscrow -o wrappers-acton/TonNativeEscrow.gen.tolk
          acton wrapper TonJettonEscrow -o wrappers-acton/TonJettonEscrow.gen.tolk
      - name: Check formatting
        run: acton fmt --check
      - name: Run contract linter
        run: acton check --output-format github
      - name: Run contract tests, deterministic fuzz and gas regression gate
        run: acton test tests-acton --baseline-snapshot tests-acton/gas-baseline.json --fail-on-diff
      - name: Enforce native critical and major mutation score
        run: acton test tests-acton --mutate --mutate-contract TonNativeEscrow --mutation-levels critical,major --mutation-minimum-percent 100 --mutation-workers 2
      - name: Enforce Jetton critical and major mutation score
        run: acton test tests-acton --mutate --mutate-contract TonJettonEscrow --mutation-levels critical,major --mutation-minimum-percent 100 --mutation-workers 2
      - name: Upload authoritative Acton artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ton-escrow-acton-artifacts
          path: |
            contracts-ton/build/TonNativeEscrow.json
            contracts-ton/build/TonJettonEscrow.json
          if-no-files-found: error

  contracts-ton-reproducibility:
    name: TON independent build hash and release evidence
    runs-on: ubuntu-latest
    needs: [contracts-ton-compatibility, contracts-ton-acton]
    defaults:
      run:
        working-directory: contracts-ton
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts-ton/package-lock.json
      - name: Install pinned verification dependencies
        run: npm ci --ignore-scripts
      - name: Download Blueprint compatibility artifact
        uses: actions/download-artifact@v4
        with:
          name: ton-escrow-development-artifacts
          path: contracts-ton/build/cross/blueprint
      - name: Download authoritative Acton artifact
        uses: actions/download-artifact@v4
        with:
          name: ton-escrow-acton-artifacts
          path: contracts-ton/build/cross/acton
      - name: Verify native declared BOCs and exact code-cell hash agreement
        run: npm run release:verify-cross-build
        env:
          ACTON_VERSION: "1.1.0"
          GITHUB_SHA: ${{ github.sha }}
      - name: Verify Jetton declared BOCs and exact code-cell hash agreement
        run: npm run release:verify-jetton-cross-build
        env:
          ACTON_VERSION: "1.1.0"
          GITHUB_SHA: ${{ github.sha }}
      - name: Upload unsigned native candidate and non-authorizing Jetton evidence
        uses: actions/upload-artifact@v4
        with:
          name: ton-escrow-reproducibility-evidence
          path: |
            contracts-ton/build/TonNativeEscrow.release-candidate.json
            contracts-ton/build/TonJettonEscrow.cross-build-verification.json
          if-no-files-found: error
